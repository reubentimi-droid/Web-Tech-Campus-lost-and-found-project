<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Campus Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Campus Lost & Found - Admin Dashboard</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('browse') }}">Browse Items</a>
        </nav>
    </header>
    <div class="container">
        {% include "_flash.html" %}
        <h2>Manage Listings</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr style="background-color: #f0f0f0; text-align: left;">
                    <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Status</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Title</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Location</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for item in listings %}
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ item.id }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ item.type }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ item.title }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">{{ item.location }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">
                        <form action="/admin/delete/{{ item.id }}" method="POST" style="margin: 0;">
                            <button type="submit" style="background-color: #c0392b; padding: 6px 12px; margin: 0; font-size: 14px;">Delete</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="padding: 10px; text-align: center;">No listings to manage.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
