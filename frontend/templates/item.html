<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Item Details - Campus Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Campus Lost & Found</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('browse') }}">Browse Items</a>
            <a href="{{ url_for('report') }}">Report Item</a>
        </nav>
    </header>
    <div class="container">
        {% include "_flash.html" %}
        <h2>[{{ item.type | upper }}] {{ item.title }}</h2>
        <p><strong>Category:</strong> {{ item.category }}</p>
        <p><strong>Location:</strong> {{ item.location }}</p>
        <p><strong>Date:</strong> {{ item.item_date }}</p>
        <p><strong>Description:</strong> {{ item.description }}</p>

        <hr style="margin: 25px 0;">

        <h3>Contact the Poster</h3>
        <form action="/contact" method="POST">
            <input type="hidden" name="listing_id" value="{{ item.id }}">

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Write a message to coordinate pickup or return..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
